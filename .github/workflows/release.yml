name: Release

on:
  push:
    tags: ["v*"]
  # Lets the build matrix be exercised without publishing anything.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: .github/package.sh "${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*

  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # zigbuild pins the glibc floor. Building natively on ubuntu-latest would
      # link against its glibc and refuse to start on RHEL 8 (2.28).
      - uses: mlugg/setup-zig@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo zigbuild --release --locked --target ${{ matrix.target }}.2.28

      - name: Verify the glibc floor
        run: |
          bin="target/${{ matrix.target }}/release/dottyenv"
          floor=$(readelf -W --dyn-syms "$bin" \
                  | grep -o 'GLIBC_[0-9]\+\.[0-9]\+' | sort -uV | tail -1)
          echo "highest glibc symbol required: ${floor:-none}"
          highest=${floor#GLIBC_}
          # sort -V puts the larger version last; if that is not 2.28 the binary
          # needs something newer than RHEL 8 provides.
          if [ -n "$highest" ] && [ "$(printf '%s\n2.28\n' "$highest" | sort -V | tail -1)" != "2.28" ]; then
            echo "::error::binary requires glibc $highest, above the 2.28 floor"
            exit 1
          fi

      - name: Package tarball
        run: .github/package.sh "${{ matrix.target }}"

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm

      - name: Build .deb and .rpm
        run: |
          # --no-build reuses the zigbuild output; rebuilding here would lose the
          # glibc floor. --no-strip because the host strip cannot handle aarch64.
          cargo deb --no-build --no-strip --target "${{ matrix.target }}" --output dist/
          cargo generate-rpm --target "${{ matrix.target }}" --output dist/

      - name: Inspect the packages
        run: |
          for f in dist/*.deb; do
            echo "=== $f"
            dpkg-deb -I "$f" | sed -n 's/^ //p' | grep -E '^(Package|Version|Architecture|Depends):' || true
            dpkg-deb -c "$f" | awk '{print "   ", $6, $3}'
          done
          for f in dist/*.rpm; do
            echo "=== $f"
            ls -lh "$f" | awk '{print "    size:", $5}'
          done

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*

  # Actually install the packages on the distributions we claim to support, so
  # "runs on RHEL 8" is measured rather than inferred from the glibc floor.
  install:
    needs: linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:20.04     # oldest Ubuntu we claim, glibc 2.31
            kind: deb
          - image: debian:12
            kind: deb
          - image: almalinux:8      # RHEL 8 rebuild, glibc 2.28: the real test
            kind: rpm
          - image: fedora:latest
            kind: rpm
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-x86_64-unknown-linux-gnu
          path: dist

      - name: Install and run on ${{ matrix.image }}
        run: |
          cat > run.sh <<'SCRIPT'
          set -eux
          if [ "$KIND" = deb ]; then
            dpkg -i /dist/*_amd64.deb
          else
            rpm -i /dist/*.x86_64.rpm
          fi

          # Prove it runs, not merely that files were copied.
          dottyenv --version
          ldd "$(command -v dottyenv)" || true

          cd "$(mktemp -d)"
          printf 'DATABASE_URL=postgres://localhost/app\n' > .env
          dottyenv init --quiet
          dottyenv check
          test -f /usr/share/doc/dottyenv/README.md

          # The exit-code contract must survive packaging.
          rm dottyenv.toml
          dottyenv check && exit 1 || [ $? -eq 3 ]
          echo "OK on $(cat /etc/os-release | grep PRETTY_NAME)"
          SCRIPT
          docker run --rm -e KIND=${{ matrix.kind }} \
            -v "$PWD/dist:/dist:ro" -v "$PWD/run.sh:/run.sh:ro" \
            ${{ matrix.image }} bash /run.sh

  release:
    needs: [macos, linux, install]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          # Listed via find rather than a glob, so adding a package format later
          # cannot silently drop it from the manifest.
          find . -maxdepth 1 -type f -printf '%f\n' | sort | xargs sha256sum > /tmp/SHA256SUMS
          mv /tmp/SHA256SUMS .
          cat SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/*
