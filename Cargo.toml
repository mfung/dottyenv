[package]
name = "dottyenv"
version = "0.1.0"
edition = "2021"
description = "Validate .env files against a declared schema"
license = "MIT"
readme = "README.md"

[lib]
name = "dottyenv"
path = "src/lib.rs"

[[bin]]
name = "dottyenv"
path = "src/main.rs"

[dependencies]
anstream = "0.6"
anstyle = "1"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
assert_cmd = "2"
insta = "1"
predicates = "3"
